plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase config is kept out of the repository; without it the app still
// builds and simply offers no account sync.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// Upload-key signing is configured outside the repository (android/key.properties
// is git-ignored); without it release builds fall back to the debug key.
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

android {
    namespace = "com.sauvank.musicstream"
    compileSdk = 36
    ndkVersion = '27.0.12077973'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.sauvank.musicstream"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keyPropertiesFile.exists()) {
                keyAlias = keyProperties["keyAlias"]
                keyPassword = keyProperties["keyPassword"]
                storeFile = file(keyProperties["storeFile"])
                storePassword = keyProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keyPropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation project(':audio_decoder')
    // Opens Android's output switcher (Bluetooth, speakers, cast devices).
    implementation("androidx.mediarouter:mediarouter:1.7.0")
}
