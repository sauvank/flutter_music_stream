name: Warm caches

# GitHub caches saved by a tag run are visible to that tag only. Saving them
# on main lets every release tag restore Gradle, Flutter and pub caches.
# Runs only when dependencies or build tooling change.
on:
  push:
    branches: [main]
    paths:
      - pubspec.lock
      - 'android/**.gradle'
      - 'android/**.kts'
      - android/gradle.properties
      - 'android/gradle/**'
      - '.github/actions/**'
      - .github/workflows/warm-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-build
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      - run: flutter build appbundle --release

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
