name: Build & Release (Android & Windows)

# Builds the installable artifacts and attaches them to the GitHub release of
# the pushed version tag. Play publication lives in release.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la version (ex: v0.1.70)'
        required: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Restore signing and Firebase files
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          {
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyPassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=$RUNNER_TEMP/upload.jks"
          } > android/key.properties

      - run: flutter pub get
      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Prepare artifacts
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          mkdir release_android
          O=build/app/outputs/flutter-apk
          cp $O/app-release.apk "release_android/MusicStream-v${VERSION}-Universal.apk"
          cp $O/app-arm64-v8a-release.apk "release_android/MusicStream-v${VERSION}-arm64-v8a.apk"
          cp $O/app-armeabi-v7a-release.apk "release_android/MusicStream-v${VERSION}-armeabi-v7a.apk"
          cp $O/app-x86_64-release.apk "release_android/MusicStream-v${VERSION}-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release_android/
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip the portable build
        shell: pwsh
        run: |
          $ver = ((Get-Content pubspec.yaml | Select-String "^version:") -split ":")[1].Trim().Split("+")[0].Trim()
          New-Item -ItemType Directory -Force -Path release_windows | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "release_windows\MusicStream-v$ver-Windows-x64.zip"

      - name: Build the Setup .exe (Inno Setup)
        shell: pwsh
        run: |
          $ver = ((Get-Content pubspec.yaml | Select-String "^version:") -split ":")[1].Trim().Split("+")[0].Trim()
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" windows\installer\installer.iss
          if (-not (Test-Path "release_windows\MusicStream-v$ver-Setup-x64.exe")) { throw "Setup .exe was not produced" }

      - name: Build the .msi (WiX)
        shell: pwsh
        run: |
          $ver = ((Get-Content pubspec.yaml | Select-String "^version:") -split ":")[1].Trim().Split("+")[0].Trim()
          heat dir build\windows\x64\runner\Release -cg AppFiles -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -var var.SourceDir -out windows\installer\AppFiles.wxs
          candle -arch x64 "-dSourceDir=build\windows\x64\runner\Release" "-dAppVersion=$ver" -ext WixUIExtension windows\installer\Product.wxs windows\installer\AppFiles.wxs -out windows\installer\
          light -ext WixUIExtension -sval windows\installer\Product.wixobj windows\installer\AppFiles.wixobj -out "release_windows\MusicStream-v$ver-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release_windows/
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release_assets/
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release_assets/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: MusicStream ${{ github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
