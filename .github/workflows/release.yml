name: Release

# One run per version tag (scripts/bump_and_push.sh creates it): tests, Android
# bundle and APKs, Windows installers, Google Play upload and GitHub release.
# Builds run in parallel jobs. Tag runs cannot save caches reusable by later
# tags, so warm-cache.yml fills them on main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la version (ex: v0.1.70)'
        required: true
      track:
        description: Play track (internal, alpha, beta, production)
        default: internal
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.release_tag || github.ref }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-bundle:
    name: Android bundle + universal APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: ./.github/actions/setup-android-build
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          upload-keystore-base64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          upload-keystore-password: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      - run: flutter build appbundle --release

      # The universal APK is extracted from the bundle instead of a second
      # full Flutter build.
      - name: Universal APK from the bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/universal.apks" \
            --ks="$RUNNER_TEMP/upload.jks" --ks-key-alias=upload \
            --ks-pass="pass:$UPLOAD_KEYSTORE_PASSWORD" --key-pass="pass:$UPLOAD_KEYSTORE_PASSWORD"
          mkdir release_universal
          unzip -p "$RUNNER_TEMP/universal.apks" universal.apk \
            > "release_universal/MusicStream-v${VERSION}-Universal.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-universal
          path: release_universal/
          retention-days: 1

  android-apk:
    name: Android per-ABI APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: ./.github/actions/setup-android-build
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          upload-keystore-base64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          upload-keystore-password: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      # x86_64 (emulators) stays available through the universal APK.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Prepare artifacts
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          mkdir release_android
          O=build/app/outputs/flutter-apk
          cp $O/app-arm64-v8a-release.apk "release_android/MusicStream-v${VERSION}-arm64-v8a.apk"
          cp $O/app-armeabi-v7a-release.apk "release_android/MusicStream-v${VERSION}-armeabi-v7a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-abi
          path: release_android/
          retention-days: 1

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        shell: pwsh
        env:
          FIREBASE_DESKTOP_CONFIG_B64: ${{ secrets.FIREBASE_DESKTOP_CONFIG_B64 }}
        run: flutter build windows --release "--dart-define=FIREBASE_DESKTOP_CONFIG_B64=$env:FIREBASE_DESKTOP_CONFIG_B64"

      - name: Package zip, Setup .exe and .msi
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ver = ((Get-Content pubspec.yaml | Select-String "^version:") -split ":")[1].Trim().Split("+")[0].Trim()
          $rel = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path release_windows | Out-Null
          Compress-Archive -Path "$rel\*" -DestinationPath "release_windows\MusicStream-v$ver-Windows-x64.zip"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$ver" windows\installer\installer.iss
          if (-not (Test-Path "release_windows\MusicStream-v$ver-Setup-x64.exe")) { throw "Setup .exe was not produced" }

          heat dir $rel -cg AppFiles -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -var var.SourceDir -out windows\installer\AppFiles.wxs
          candle -arch x64 "-dSourceDir=$rel" "-dAppVersion=$ver" -ext WixUIExtension windows\installer\Product.wxs windows\installer\AppFiles.wxs -out windows\installer\
          light -ext WixUIExtension -sval windows\installer\Product.wixobj windows\installer\AppFiles.wixobj -out "release_windows\MusicStream-v$ver-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release_windows/
          retention-days: 1

  play:
    name: Publish to Google Play
    needs: [quality, android-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: play-bundle
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sauvank.musicstream
          releaseFiles: app-release.aab
          tracks: ${{ inputs.track || 'internal' }}
          status: completed

  github-release:
    name: Publish GitHub Release
    needs: [quality, android-bundle, android-apk, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release_assets/
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: MusicStream ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
