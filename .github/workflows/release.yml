name: Release

# Publishes to Google Play when a version tag is pushed (scripts/bump_and_push.sh
# creates it). The tag deploys to the internal testing track; run this workflow
# by hand to publish a tag to another track.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track (internal, alpha, beta, production)
        default: internal
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Restore signing and Firebase files
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          {
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyPassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=$RUNNER_TEMP/upload.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sauvank.musicstream
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          status: completed
